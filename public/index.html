<!DOCTYPE html>
<html lang="en">
<head>
    <title>Frame Data API</title>
    <script src="app.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="characters" class="characters">
        No content yet.
        <button type="button" onclick="fetchCharacters()">Load Characters</button>
    </div>

    <div id="register" class="register">
        <form id="registerForm" onsubmit="event.preventDefault(); registerUser();">
            <h2>Register</h2>

            <label for="regUsername">Username:</label><br>
            <input type="text" id="regUsername" name="regUsername"><br><br>

            <label for="regPassword">Password:</label><br>
            <input type="password" id="regPassword" name="regPassword"><br><br>

            <button type="submit">Register</button>
        </form>
    </div>

    <div id="login" class="login">
        <form id="loginForm" onsubmit="event.preventDefault(); loginUser();">
            <h2>Login</h2>

            <label for="logUsername">Username:</label><br>
            <input type="text" id="logUsername" name="logUsername"><br><br>

            <label for="logPassword">Password:</label><br>
            <input type="password" id="logPassword" name="logPassword"><br><br>

            <button type="submit">Login</button>
        </form>
    </div>

    <div id="addCharacters" class="addCharacters">
        <form id="addCharForm" onsubmit="event.preventDefault(); addCharacters()">
            <h2>Add Character</h2>

            <label for="addChar">Character Name</label><br>
            <input type="text" id="addChar" name="addChar"><br><br>
            <button type="submit" id="addCharButton">Add Character</button>
        </form>

    </div>
    <div id="getFrameData" class="getFrameData">
        <h2>Get Frame Data</h2><br><br>
        <form onsubmit="event.preventDefault(); getFrameData()" id="getFrameDataForm">
            <label for="getFrameDataInput">Character</label><br>
            <input type="text" id="getFrameDataInput" name="getFrameDataInput"><br><br>
            <button type="submit">Get Data</button>
        </form>
        
    </div>
</body>
</html>
