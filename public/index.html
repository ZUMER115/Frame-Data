<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frame Data</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Frame Data</h1>
        <nav>
            <button class="tab-btn active" data-tab="characters">Characters</button>
            <button class="tab-btn" data-tab="moves">Moves</button>
            <button class="tab-btn" data-tab="frame-data">Frame Data</button>
        </nav>
    </header>

    <main>
        <!-- Characters Tab -->
        <section id="characters" class="tab active">
            <h2>Characters</h2>
            <form id="add-character-form">
                <input type="text" id="character-name" placeholder="Character name" required>
                <button type="submit">Add Character</button>
            </form>
            <table id="characters-table">
                <thead>
                    <tr><th>ID</th><th>Name</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>

        <!-- Moves Tab -->
        <section id="moves" class="tab">
            <h2>Moves</h2>
            <form id="add-move-form">
                <input type="text" id="move-name" placeholder="Move (e.g. 5A, jab, 214P)" required>
                <button type="submit">Add Move</button>
            </form>
            <table id="moves-table">
                <thead>
                    <tr><th>ID</th><th>Move</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>

        <!-- Frame Data Tab -->
        <section id="frame-data" class="tab">
            <h2>Frame Data</h2>
            <div class="character-select-row">
                <select id="character-select">
                    <option value="">Select a character...</option>
                </select>
                <button id="load-btn">Load</button>
            </div>

            <div id="frame-data-content" class="hidden">
                <h3 id="frame-data-title"></h3>
                <table id="frame-data-table">
                    <thead>
                        <tr>
                            <th>Move</th>
                            <th>Startup</th>
                            <th>On Block</th>
                            <th>Recovery</th>
                            <th>On Hit</th>
                            <th>Notes</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>

                <h3 id="form-heading">Add Frame Data</h3>
                <form id="frame-data-form">
                    <select id="fd-move" required>
                        <option value="">Select move...</option>
                    </select>
                    <input type="text" id="fd-startup" placeholder="Startup">
                    <input type="text" id="fd-on-block" placeholder="On Block">
                    <input type="text" id="fd-recovery" placeholder="Recovery">
                    <input type="text" id="fd-on-hit" placeholder="On Hit">
                    <input type="text" id="fd-notes" placeholder="Notes">
                    <div class="form-actions">
                        <button type="submit" id="form-submit-btn">Add</button>
                        <button type="button" id="cancel-edit-btn" class="btn-secondary hidden">Cancel</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <div id="toast" class="toast hidden"></div>

    <script src="app.js"></script>
</body>
</html>
